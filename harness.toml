[roles.commander]
cli = "codex"
model = "gpt-6-astra"
effort = "high"

[roles.fable]
cli = "claude"
model = "claude-fable-5-1"
effort = "high"

[roles.worker]
cli = "claude"
model = "claude-opus-5-5"
effort = "high"

[roles.reviewer]
cli = "codex"
model = "gpt-6.1-sol"
effort = "high"

[runtime]
agent_timeout_seconds = 1800
verify_timeout_seconds = 300
max_attempts = 3
max_final_attempts = 3
max_total_attempts = 60
max_agent_dispatches = 200
max_replans = 2
max_tasks = 20
context_chars = 100000
claude_max_turns = 50

[permissions]
# 额外授权给 Claude worker 的精确 argv，由命令 MCP 按 ID 执行；* 和换行按字面传入。
# 例如 [["npm", "run", "build"]]；管道需单独授权完整 shell argv。这不是操作系统沙箱。
worker_commands = []

[memory]
# 0 表示不设到期时间；过期记录仍保留历史，默认检索不返回。
task_ttl_days = 180
knowledge_ttl_days = 180

[shared]
rules = "shared/RULES.md"
skills = "shared/skills"
mcp = "shared/mcp.json"
hooks = "shared/hooks.json"

[verification]
# 配置目标项目的验证命令。这里的默认值用于本 Harness 项目。
commands = [["python3", "-m", "unittest", "discover", "-s", "tests", "-v"]]
# 显式开启后，整体验证在仓库之外的全新 detached worktree 中执行。
# setup_commands 只供确定性验证器准备依赖，不授予 worker Bash 权限。
fresh_checkout = false
setup_commands = []
