[roles.commander]
cli = "codex"
model = "gpt-6-astra"
effort = "high"

[roles.fable]
cli = "claude"
model = "claude-fable-5-1"
effort = "high"

[roles.worker]
cli = "claude"
model = "claude-opus-5-5"
effort = "high"

[roles.reviewer]
cli = "codex"
model = "gpt-6.1-sol"
effort = "high"

[runtime]
agent_timeout_seconds = 3600
verify_timeout_seconds = 300
# 每个任务的 worker 工作尝试上限；已校验的环境或操作者阻断不计入。
max_attempts = 3
max_final_attempts = 3
# 整个 run 的模型调用总数（指挥、worker、审阅、格式修正都计入），通常远多于任务数。
max_agent_dispatches = 200
max_replans = 2
# 计划中的任务数上限，不是调用数。
max_tasks = 20
context_chars = 100000
claude_max_turns = 50
# 单次 Claude 派发的轮数保护，不是任务工具总次数；未列角色沿用上面的值。
# worker 的 200 是长任务起始配置，需按实际到限率、验收和重复工作校准。
claude_max_turns_by_role = { worker = 200 }

[permissions]
# 额外授权给 Claude worker 的精确 argv，由命令 MCP 按 ID 执行；* 和换行按字面传入。
# 例如 [["npm", "run", "build"]]；管道需单独授权完整 shell argv。这不是操作系统沙箱。
# 形式表内的只读 Git 查询用内置 git_query，范围内已跟踪文件的删除用 delete_path，二者无需在此授权。
worker_commands = []

[memory]
# 0 表示不设到期时间；过期记录仍保留历史，默认检索不返回。
task_ttl_days = 180
knowledge_ttl_days = 180

[shared]
rules = "shared/RULES.md"
skills = "shared/skills"
mcp = "shared/mcp.json"
hooks = "shared/hooks.json"

[verification]
# 配置目标项目的验证命令。这里的默认值用于本 Harness 项目。
commands = [["python3", "-m", "unittest", "discover", "-s", "tests", "-v"]]
# 显式开启后，整体验证在仓库之外的全新 detached worktree 中执行。
# setup_commands 只供确定性验证器准备依赖，不授予 worker Bash 权限。
fresh_checkout = false
setup_commands = []
