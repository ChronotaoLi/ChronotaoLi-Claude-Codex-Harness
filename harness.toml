# 操作者配置：模型、预算、记忆与共用资源，对所有目标项目相同。
# 验证命令与 worker 命令授权属于项目配置，写在目标仓库 Git 根目录下的 .harness/project.toml，
# 示例见 examples/project.toml；项目配置里的 [runtime] 键逐个覆盖这里的同名键。

[roles.commander]
cli = "codex"
model = "gpt-6.2-astra"
effort = "high"

[roles.fable]
cli = "claude"
model = "claude-fable-5-2"
effort = "high"

[roles.worker]
cli = "claude"
model = "claude-opus-5-5"
effort = "high"

[roles.reviewer]
cli = "codex"
model = "gpt-6.2-sol"
effort = "high"

[runtime]
agent_timeout_seconds = 3600
verify_timeout_seconds = 300
# 每个任务的 worker 工作尝试上限；已校验的环境或操作者阻断不计入。
max_attempts = 5
# 整个 run 的模型调用总数（指挥决定、worker、审阅与无效输出的重做都计入），通常远多于任务数。
# 修订次数、整体尝试次数和计划任务数没有单独的上限；计划大小由整体审阅的必要上下文约束。
max_agent_dispatches = 200
context_chars = 100000
claude_max_turns = 50
# 单次 Claude 派发的轮数保护，不是任务工具总次数；未列角色沿用上面的值。
# worker 的 200 是长任务起始配置，需按实际到限率、验收和重复工作校准。
claude_max_turns_by_role = { worker = 200 }
# Claude 角色额度用尽（usage_limit）后在同一进程里等到快照给出的重置时刻再继续，单次最多这么多秒；0 关闭。
# 这是等待策略不是预算：恢复时可调高、调低或设 0；每次等待之前都有一次计入 max_agent_dispatches 的失败调用。
quota_wait_max_seconds = 21600

[memory]
# 0 表示不设到期时间；过期记录仍保留历史，默认检索不返回。
task_ttl_days = 180
knowledge_ttl_days = 180

[shared]
# 相对路径相对本文件所在目录解析。
rules = "shared/RULES.md"
skills = "shared/skills"
mcp = "shared/mcp.json"
